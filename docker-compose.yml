services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scanner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend2
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://scanner:${POSTGRES_PASSWORD:-scanner}@postgres:5432/scanner
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend2
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://scanner:${POSTGRES_PASSWORD:-scanner}@postgres:5432/scanner
      REDIS_URL: redis://redis:6379/0
      # Override SECRET_KEY via .env or environment — default is for local dev only
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32-chars!!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend2
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://scanner:${POSTGRES_PASSWORD:-scanner}@postgres:5432/scanner
      REDIS_URL: redis://redis:6379/0
      # Override SECRET_KEY via .env or environment — default is for local dev only
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32-chars!!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend1
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
